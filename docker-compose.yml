# Local development database only — never used in production.
# Start with `pnpm db:up`, stop with `pnpm db:down`. Credentials come from the root `.env`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: tabularium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabularium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabularium}
      POSTGRES_DB: ${POSTGRES_DB:-tabularium}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tabularium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tabularium-pgdata:
